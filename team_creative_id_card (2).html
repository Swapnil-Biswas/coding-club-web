<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Team Creative ID Card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap');

  body {
    margin: 0;
    padding: 40px;
    background: #0f2418;
    display: flex;
    justify-content: center;
    font-family: 'Space Mono', monospace;
  }

  .card {
    width: 420px;
    height: 720px;
    background: #1e3d2b;
    border-radius: 26px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 3px solid #f4c93b;
  }

  .newspaper-bg {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 38px, rgba(244,201,59,0.05) 38px 39px),
      repeating-linear-gradient(90deg, transparent 0 90px, rgba(244,201,59,0.03) 90px 91px);
    opacity: 0.9;
  }
  .newspaper-bg::before {
    content: "HACKER HOUSE GOA 2026 BUILD SHIP LAUNCH 28 31 OCT GOA INDIA HACKER HOUSE GOA BUILD SHIP LAUNCH";
    position: absolute;
    inset: 0;
    color: rgba(244,201,59,0.08);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    line-height: 13px;
    padding: 20px;
    word-spacing: 4px;
    overflow: hidden;
  }

  .credit {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    text-align: center;
    color: #a8c9b0;
    font-size: 10px;
    letter-spacing: 2px;
    z-index: 6;
  }

  .badge {
    position: absolute;
    top: 44px;
    left: 24px;
    z-index: 6;
    background: #f4c93b;
    border-radius: 20px;
    padding: 4px 12px 4px 4px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }
  .badge-icon {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #d94f8c;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Archivo Black', sans-serif;
  }
  .badge-text {
    font-family: 'Space Mono', monospace;
    line-height: 1.1;
  }
  .badge-text b { display: block; font-size: 10px; color: #1e3d2b; }
  .badge-text span { font-size: 7px; color: #4a3f1a; letter-spacing: 0.5px; }

  .rings {
    position: absolute;
    top: 70px;
    right: -40px;
    z-index: 1;
    opacity: 0.9;
  }

  .heading {
    position: relative;
    z-index: 3;
    padding: 100px 26px 0;
  }
  .heading h1 {
    font-family: 'Anton', sans-serif;
    font-size: 52px;
    line-height: 0.92;
    color: #f4c93b;
    margin: 0;
    letter-spacing: 1px;
  }
  .heading .goa-tag {
    display: inline-block;
    background: #d94f8c;
    color: #f4c93b;
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    letter-spacing: 2px;
    padding: 2px 14px;
    border-radius: 6px;
    margin-top: 8px;
    transform: rotate(-2deg);
  }
  .heading .years {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 14px;
    color: #f2ede0;
    margin-top: 10px;
    border-bottom: 2px solid #f4c93b;
    display: inline-block;
    padding-bottom: 4px;
    letter-spacing: 1px;
  }

  .photo-zone {
    position: absolute;
    z-index: 2;
    top: 130px;
    left: 0;
    right: 0;
    bottom: 0;
    overflow: hidden;
  }
  .photo-frame {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  .photo-frame img {
    width: 94%;
    height: 100%;
    margin: 0 3%;
    object-fit: cover;
    object-position: top center;
    display: block;
    /* soft fade at the top so the photo blends into the card instead of a hard edge */
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 130px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 130px);
  }
  .photo-placeholder {
    width: 94%;
    height: 92%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #8fbf9f;
    border: 2px dashed #8fbf9f;
    border-radius: 12px;
    box-sizing: border-box;
  }
  .photo-placeholder .icon {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: #2d5a3f;
    margin-bottom: 12px;
  }
  .photo-placeholder span {
    font-size: 11px;
    letter-spacing: 1px;
  }

  .name-strip {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 190px;
    z-index: 4;
    background:
      repeating-linear-gradient(0deg, transparent 0 20px, rgba(244,201,59,0.04) 20px 21px);
    background-color: #f4c93b;
    clip-path: polygon(0 22%, 100% 0%, 100% 100%, 0% 100%);
  }
  .name-strip::before {
    content: "HACKER HOUSE GOA BUILD SHIP LAUNCH GOA INDIA OCT 2026 HACKER HOUSE GOA";
    position: absolute;
    inset: 0;
    color: rgba(30,61,43,0.08);
    font-size: 10px;
    line-height: 12px;
    padding: 20px;
    overflow: hidden;
  }

  .name-text {
    position: absolute;
    bottom: 34px;
    left: 26px;
    right: 26px;
    z-index: 5;
  }
  .name-text h2 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 58px;
    color: #1e3d2b;
    margin: 0;
    letter-spacing: 1px;
    line-height: 1;
  }
  .name-text .role {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: #4a3f1a;
    margin-top: 8px;
    font-weight: 700;
  }

  .strip-deco {
    position: absolute;
    bottom: 128px;
    left: 26px;
    right: 26px;
    z-index: 5;
  }
  .strip-deco .deco-line {
    width: 100%;
    height: 2px;
    background: #1e3d2b;
    opacity: 0.5;
  }
  .strip-deco .deco-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 3px;
    color: #4a3f1a;
    margin-top: 8px;
    font-weight: 700;
  }
</style>
</head>

  <div class="credit">HACKER HOUSE GOA · BUILDER ID</div>

  <div class="badge">

    <circle cx="130" cy="130" r="80" fill="none" stroke="#d94f8c" stroke-width="14"/>
